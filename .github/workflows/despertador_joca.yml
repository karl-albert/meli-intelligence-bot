name: Despertador Keep-Alive Joca & Alerta Faturamento ML

on:
  schedule:
    # 1. Keep-Alive do Joca a cada 10 min (06:00 às 02:00 BRT / 09:00 às 05:00 UTC)
    - cron: '*/10 0-4,9-23 * * *'
    # 2. Alertas Oficiais de Faturamento ML (11:00 e 15:00 BRT -> 14:00 e 18:00 UTC)
    - cron: '0 14,18 * * *'
    # 3. Alerta Oficial de Faturamento ML (21:00 BRT -> 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite disparo manual imediato a qualquer momento

jobs:
  ping_joca:
    name: Ping Keep-Alive no Joca
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive no Joca Intelligence Hub
        run: |
          echo "Disparando ping de despertar / keep-alive para Joca..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --max-time 120 "https://meli-intelligence-bot.onrender.com/ping")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Joca acordado e operando com sucesso! (Status: $STATUS)"
          else
            echo "Aviso: Resposta inesperada do Joca (Status: $STATUS)"
          fi

  alerta_faturamento:
    name: Enviar Frase de Faturamento no Telegram (11h, 15h e 21h BRT)
    runs-on: ubuntu-latest
    # Executa se for disparo manual OU nos 3 horários oficiais programados
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 14,18 * * *' || github.event.schedule == '0 0 * * *'
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery db-dtypes requests

      - name: Executar Consulta e Enviar para o Telegram
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: 'mercado-livre-mais-vendidos'
          TELEGRAM_TOKEN: '8916733671:AAH1htvd6VqDKsngdyYsFOaXdvNgUQ0RjyM'
          TELEGRAM_CHAT_ID: '8269176751'
        run: |
          python enviar_alerta_faturamento.py

