name: Atualizar Prints Executivos ML (BigQuery Nuvem 24/7)

on:
  schedule:
    # 08h30 Horário de Brasília (BRT / UTC-3) -> 11h30 UTC (Abertura Comercial)
    - cron: '30 11 * * *'
    # 14h00 Horário de Brasília (BRT / UTC-3) -> 17h00 UTC (Check Intermediário)
    - cron: '0 17 * * *'
    # 18h30 Horário de Brasília (BRT / UTC-3) -> 21h30 UTC (Pico da Tarde)
    - cron: '30 21 * * *'
    # 23h45 Horário de Brasília (BRT / UTC-3) -> 02h45 UTC (Fechamento do Dia)
    - cron: '45 2 * * *'
  workflow_dispatch: # Permite disparo manual imediato pelo GitHub a qualquer momento

jobs:
  gerar-prints:
    name: Gerar e Sincronizar Prints Executivos (BigQuery)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências do Sistema & Navegador Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser fonts-liberation fonts-dejavu-core

      - name: Instalar Dependências Python & Node
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow google-cloud-bigquery db-dtypes
          npm install vega@5

      - name: Executar Gerador Autônomo de Prints (BigQuery)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'mercado-livre-mais-vendidos' }}
          RENDER_BOT_URL: ${{ secrets.RENDER_BOT_URL || 'https://meli-intelligence-bot.onrender.com' }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET || 'meli_joca_sync_2026_karl' }}
        run: |
          python gerar_prints_cloud.py

      - name: Commit e Push dos Prints Atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prints/ payload_*.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos prints."
          else
            git commit -m "chore(prints): atualizar prints executivos via BigQuery [skip ci]"
            git push
          fi
